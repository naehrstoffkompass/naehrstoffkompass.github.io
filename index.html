<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nährstoffkompass – Orientierung zu Nährstoffen & Wirkungen</title>
  <style>
    :root {
      --bg-color: #f7f8f6;
      --card-bg: #ffffff;
      --primary: #1b3b2b;
      --muted: #6b746f;
      --accent: #2e6f40;
      --border: #e6e9e6;
      --glass: rgba(255,255,255,0.6);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial; background: linear-gradient(180deg,#fbfdfb 0%,var(--bg-color) 100%); color: var(--primary); line-height: 1.5; }

    header { background: linear-gradient(90deg,#234833 0%, #165a3f 100%); color: white; padding: 28px 18px; text-align: center; box-shadow: 0 6px 20px rgba(20,40,30,0.12); }
    header h1 { font-size: 1.6rem; font-weight: 700; letter-spacing: -0.5px; }
    header p { color: rgba(255,255,255,0.9); margin-top: 6px; font-size: 0.95rem; }

    nav { margin-top: 12px; display:flex; justify-content:center; gap:10px; }
    nav button { background: rgba(255,255,255,0.12); border: 1px solid rgba(255,255,255,0.14); color: white; padding: 8px 14px; border-radius: 999px; cursor:pointer; font-weight:600; }

    main { max-width: 980px; margin: 20px auto; padding: 18px; }

    .search-box { margin-bottom: 20px; }
    .search-box input { width:100%; padding:14px 16px; border-radius:12px; border:1px solid var(--border); background:var(--glass); box-shadow:0 4px 18px rgba(16,30,20,0.06); font-size:1rem; color:var(--primary); }

    .groups-grid { display:grid; grid-template-columns: repeat(auto-fit,minmax(240px,1fr)); gap:18px; margin-bottom:26px; }
    .group-card { background:var(--card-bg); border-radius:14px; padding:16px; border:1px solid var(--border); display:flex; gap:12px; align-items:center; box-shadow:0 6px 20px rgba(20,40,30,0.04); }
    .group-illustration { width:72px; height:72px; flex: 0 0 72px; border-radius:12px; display:flex; align-items:center; justify-content:center; }
    .group-body h3 { font-size:1.05rem; margin-bottom:6px; }
    .group-body p { color:var(--muted); font-size:0.9rem; margin-bottom:8px; }
    .group-btn { background: linear-gradient(180deg,#1e4f37,#165a3f); color:white; border:none; padding:8px 12px; border-radius:10px; cursor:pointer; font-weight:700; font-size:0.9rem; }

    .nutrient-card { background:linear-gradient(180deg, #ffffff, #fbfcfb); border-radius:14px; padding:18px; border:1px solid var(--border); box-shadow: 0 10px 30px rgba(20,40,30,0.05); display:flex; gap:14px; align-items:flex-start; }
    .nutrient-illustration { width:64px; height:64px; border-radius:12px; flex:0 0 64px; display:flex; align-items:center; justify-content:center; }
    .nutrient-content h3 { margin:0 0 6px 0; font-size:1.1rem; }
    .category-tag { background:linear-gradient(90deg,#f0fbf4,#e8f6ec); color:var(--accent); padding:6px 10px; border-radius:999px; font-size:0.78rem; font-weight:700; }
    .short-desc { color:var(--muted); margin:8px 0 12px 0; }
    .toggle-details-btn { background:none; border:none; color:var(--accent); font-weight:700; cursor:pointer; }

    .details-content { display:none; margin-top:12px; padding-top:12px; border-top:1px dashed var(--border); }
    .details-content.open { display:block; }

    .nutrient-section h4 { margin:0 0 6px 0; font-size:0.78rem; color:var(--muted); text-transform:uppercase; letter-spacing:0.6px; }
    .food-box { background:#f6fbf7; border-left:4px solid #e6f4ea; padding:10px 12px; border-radius:8px; margin-top:8px; }

    footer { max-width:980px; margin:28px auto; padding:14px 18px; color:var(--muted); font-size:0.9rem; text-align:center; }

    /* Responsive */
    @media (max-width:640px) { .group-card { flex-direction:row; } main { padding:12px; } }
  </style>
</head>
<body>

  <header role="banner">
    <h1>Nährstoffkompass</h1>
    <p>Sachliche Orientierung zu Nährstoffen, Wirkungen und Verträglichkeit.</p>
    <nav aria-label="Hauptnavigation">
      <button onclick="showHome()">Startseite</button>
      <button onclick="alert('Impressum: Angaben folgen.')">Impressum</button>
    </nav>
  </header>

  <main role="main">
    <div class="search-box">
      <input type="text" id="searchInput" placeholder="Stoff suchen (z.B. Vitamin D, Magnesium, Kreatin)..." oninput="handleSearch()">
    </div>

    <div id="contentView"></div>
  </main>

  <footer role="contentinfo">
    <p>Hinweis: Die Inhalte dienen der allgemeinen Information und ersetzen keine ärztliche oder pharmazeutische Beratung. Dosierungen und Verträglichkeit können individuell abweichen.</p>
  </footer>

  <script>
    // Small inline SVG illustrations per category — simple, scalable and theme-appropriate
    function svgForCategory(key, size = 56) {
      const s = size;
      switch (key) {
        case 'Makronährstoffe':
          return `<div style="width:${s}px;height:${s}px;border-radius:12px;background:linear-gradient(135deg,#fff7ed,#fff1e6);display:flex;align-items:center;justify-content:center;">
            <svg width="36" height="36" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M3 12h18" stroke="#d96a2b" stroke-width="1.8" stroke-linecap="round"/><path d="M7 8v8" stroke="#d96a2b" stroke-width="1.8" stroke-linecap="round"/><path d="M17 8v8" stroke="#d96a2b" stroke-width="1.8" stroke-linecap="round"/></svg>
          </div>`;
        case 'Vitamine':
          return `<div style="width:${s}px;height:${s}px;border-radius:12px;background:linear-gradient(135deg,#fffbe6,#fff3cc);display:flex;align-items:center;justify-content:center;">
            <svg width="36" height="36" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="8" r="4" fill="#ffb74d"/><path d="M12 12v6" stroke="#ed8e2e" stroke-width="1.6" stroke-linecap="round"/></svg>
          </div>`;
        case 'Mineralstoffe':
          return `<div style="width:${s}px;height:${s}px;border-radius:12px;background:linear-gradient(135deg,#eef7ff,#e8f3ff);display:flex;align-items:center;justify-content:center;">
            <svg width="36" height="36" viewBox="0 0 24 24" fill="none"><path d="M12 3l7 4v6c0 4-7 8-7 8s-7-4-7-8V7l7-4z" fill="#98c6ff" stroke="#6aa0ff" stroke-width="0.8"/></svg>
          </div>`;
        case 'Fettsäuren':
          return `<div style="width:${s}px;height:${s}px;border-radius:12px;background:linear-gradient(135deg,#fff6f9,#fff0f5);display:flex;align-items:center;justify-content:center;">
            <svg width="36" height="36" viewBox="0 0 24 24" fill="none"><path d="M12 2C9 6 6 7 6 11c0 5 6 9 6 9s6-4 6-9c0-4-3-5-6-9z" fill="#ff9fb3" stroke="#ff6f92" stroke-width="0.8"/></svg>
          </div>`;
        case 'Pflanzenstoffe':
          return `<div style="width:${s}px;height:${s}px;border-radius:12px;background:linear-gradient(135deg,#f4fff4,#e8fcee);display:flex;align-items:center;justify-content:center;">
            <svg width="36" height="36" viewBox="0 0 24 24" fill="none"><path d="M12 2c3 2 5 4 5 7 0 4-5 7-5 13-0-6-5-9-5-13 0-3 2-5 5-7z" fill="#9ae6a0" stroke="#49b864" stroke-width="0.8"/></svg>
          </div>`;
        case 'Performance':
          return `<div style="width:${s}px;height:${s}px;border-radius:12px;background:linear-gradient(135deg,#fffdf0,#fff9e6);display:flex;align-items:center;justify-content:center;">
            <svg width="36" height="36" viewBox="0 0 24 24" fill="none"><path d="M3 12h6l3-8 3 16 2-8h3" stroke="#ffb84d" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </div>`;
        case 'Darmgesundheit':
          return `<div style="width:${s}px;height:${s}px;border-radius:12px;background:linear-gradient(135deg,#fffaf6,#fff4ec);display:flex;align-items:center;justify-content:center;">
            <svg width="36" height="36" viewBox="0 0 24 24" fill="none"><path d="M4 12c0-4 4-8 8-8s8 4 8 8-4 8-8 8S4 16 4 12z" fill="#ffdca6" stroke="#ffb74d" stroke-width="0.8"/></svg>
          </div>`;
        default:
          return `<div style="width:${s}px;height:${s}px;border-radius:12px;background:#f0f0f0;"><svg width="36" height="36" viewBox="0 0 24 24" fill="none"></svg></div>`;
      }
    }

    const categoriesData = [
      { name: "Makronährstoffe & Aminosäuren", count: "11 Stoffe", key: "Makronährstoffe" },
      { name: "Vitamine", count: "13 Stoffe", key: "Vitamine" },
      { name: "Mineralstoffe & Spurenelemente", count: "11 Stoffe", key: "Mineralstoffe" },
      { name: "Fettsäuren & Lipide", count: "5 Stoffe", key: "Fettsäuren" },
      { name: "Pflanzenstoffe & Antioxidantien", count: "5 Stoffe", key: "Pflanzenstoffe" },
      { name: "Performance & Sport", count: "4 Stoffe", key: "Performance" },
      { name: "Darm & Verdauung", count: "3 Stoffe", key: "Darmgesundheit" }
    ];

    const nutrientsData = [
      { id: "protein", name: "Protein (Eiweiß)", category: "Makronährstoffe", funktion: "Hauptbaustein für Muskeln, Gewebe, Enzyme, Hormone und Immunsystem.", mangel: "Muskelabbau, Wundheilungsstörungen, geschwächtes Immunsystem.", tagesbedarf: "Ca. 0,8 g bis 2,0 g pro kg Körpergewicht.", quellen: "Hähnchenbrust, Rindfleisch, Magerquark, Eier, Linsen, Sojabohnen, Mandeln." },
      { id: "kohlenhydrate", name: "Komplexe Kohlenhydrate", category: "Makronährstoffe", funktion: "Hauptenergieträger für Muskeln und Gehirn.", mangel: "Leistungsabfall, Müdigkeit, Konzentrationsschwäche.", tagesbedarf: "Ca. 45–55 % der täglichen Kalorienmenge.", quellen: "Haferflocken, Vollkornbrot, Kartoffeln, Quinoa, brauner Reis." },
      { id: "ballaststoffe", name: "Ballaststoffe", category: "Makronährstoffe", funktion: "Fördern eine gesunde Verdauung, Sättigung und gesunde Darmbakterien.", mangel: "Verstopfung, träge Verdauung, Blutzuckerschwankungen.", tagesbedarf: "Mindestens 30 g pro Tag (DGE).", quellen: "Leinsamen, Flohsamenschalen, Vollkornprodukte, Bohnen, Brokkoli." },
      { id: "carnitin", name: "L-Carnitin", category: "Makronährstoffe", funktion: "Transportiert Fettsäuren in die Muskelzellen zur Fettverbrennung.", mangel: "Muskelschwäche, schnelle Erschöpfung.", tagesbedarf: "Körpereigene Synthese; Aufnahme über Nahrung.", quellen: "Rindfleisch, Lammfleisch, Wild, Dorsch." },
      { id: "glutamin", name: "L-Glutamin", category: "Makronährstoffe", funktion: "Haupttreibstoff für Magen-Darm-Zellen und Immunsystem.", mangel: "Darmprobleme, verlangsamte Regeneration.", tagesbedarf: "Erhöhter Bedarf bei intensivem Sport und Stress.", quellen: "Magerquark, Eier, Sojabohnen, Rindfleisch." },
      { id: "arginin", name: "L-Arginin", category: "Makronährstoffe", funktion: "Fördert die Gefäßerweiterung, Durchblutung und Nährstoffversorgung.", mangel: "Durchblutungsstörungen, hoher Blutdruck.", tagesbedarf: "Ca. 2–5 g bei sportlicher Belastung.", quellen: "Kürbiskerne, Erdnüsse, Hähnchenbrust, Walnüsse." },

      { id: "vitamin-a", name: "Vitamin A (Retinol)", category: "Vitamine", funktion: "Unterstützt Sehkraft, Immunsystem, Zellwachstum sowie Haut.", mangel: "Nachtblindheit, trockene Haut, erhöhte Infektanfälligkeit.", tagesbedarf: "Ca. 700–850 µg RAE pro Tag.", quellen: "Rinderleber, Karotten (Beta-Carotin), Süßkartoffeln, Spinat, Eigelb." },
      { id: "vitamin-b12", name: "Vitamin B12 (Cobalamin)", category: "Vitamine", funktion: "Essenziell für Blutbildung, Nervensystem und DNA-Synthese.", mangel: "Müdigkeit, Kribbeln in Händen/Füßen, Anämie.", tagesbedarf: "Ca. 4,0 µg pro Tag.", quellen: "Rindfleisch, Lachs, Eier, Käse (für Veganer als Supplement)." },
      { id: "vitamin-c", name: "Vitamin C (Ascorbinsäure)", category: "Vitamine", funktion: "Starkes Antioxidans, stärkt Immunsystem und Kollagensynthese.", mangel: "Infektanfälligkeit, Zahnfleischbluten, langsame Wundheilung.", tagesbedarf: "Ca. 95–110 mg pro Tag.", quellen: "Rote Paprika, schwarze Johannisbeeren, Zitrusfrüchte, Brokkoli." },
      { id: "vitamin-d3", name: "Vitamin D3 (Cholecalciferol)", category: "Vitamine", funktion: "Reguliert Kalziumaufnahme, Knochendichte, Muskeln und Immunsystem.", mangel: "Knochenerweichung, erhöhte Infektanfälligkeit, Muskelschwäche.", tagesbedarf: "Ca. 20 µg (800 IE) bei fehlender Sonnenbestrahlung.", quellen: "Sonnenlicht (UVB), Lachs, Makrele, Eigelb." },
      { id: "vitamin-k2", name: "Vitamin K2 (Menachinon)", category: "Vitamine", funktion: "Steuert die Verwertung von Kalzium in Knochen und schützt Gefäße.", mangel: "Erhöhte Blutungsneigung, geschwächte Knochen.", tagesbedarf: "Ca. 60–80 µg pro Tag.", quellen: "Fermentierte Speisen (Natto), Hartkäse, Eigelb, Butter." },

      { id: "magnesium", name: "Magnesium", category: "Mineralstoffe", funktion: "Cofaktor für >300 Enzymreaktionen, Muskel- und Nervenfunktion.", mangel: "Muskelkrämpfe, Innere Unruhe, Kopfschmerzen.", tagesbedarf: "Ca. 300–400 mg pro Tag.", quellen: "Kürbiskerne, Mandeln, Zartbitterschokolade, Haferflocken, Bohnen." },
      { id: "zink", name: "Zink", category: "Mineralstoffe", funktion: "Unerlässlich für Immunsystem, Wundheilung, Haut und Testosteronspiegel.", mangel: "Infektanfälligkeit, Haarausfall, brüchige Nägel.", tagesbedarf: "Ca. 8–14 mg pro Tag.", quellen: "Austern, Rindfleisch, Kürbiskerne, Linsen, Eier." },
      { id: "eisen", name: "Eisen", category: "Mineralstoffe", funktion: "Sauerstofftransport im Blut und zelluläre Energiegewinnung.", mangel: "Blässe, ständige Müdigkeit, Atemnot bei Belastung.", tagesbedarf: "Ca. 10–15 mg pro Tag.", quellen: "Rotes Fleisch, Linsen, Kürbiskerne, Sesam, Spinat." },

      { id: "omega-3-epa", name: "Omega-3 (EPA & DHA)", category: "Fettsäuren", funktion: "Schützt Herz-Kreislauf-System, Gehirnfunktion und hemmt Entzündungen.", mangel: "Trockene Augen, Konzentrationsschwäche, hohe Entzündungswerte.", tagesbedarf: "Mind. 250–500 mg EPA/DHA täglich.", quellen: "Lachs, Makrele, Hering, Algenöl-Kapseln." },

      { id: "kreatin", name: "Kreatin-Monohydrat", category: "Performance", funktion: "Steigert die Schnellkraft und Muskelenergie bei intensiven Workouts.", mangel: "Schnellere Ermüdung bei Kraftanstrengung.", tagesbedarf: "3–5 g täglich für volle Wirkung.", quellen: "Rindfleisch, Schweinefleisch, Hering, Lachs." },

      { id: "inulin", name: "Inulin (Präbiotikum)", category: "Darmgesundheit", funktion: "Nahrung für nützliche Darmbakterien, unterstützt eine gesunde Darmflora.", mangel: "Träge Verdauung, verringerte Mikrobiom-Vielfalt.", tagesbedarf: "Teil der empfohlenen 30 g Ballaststoffe.", quellen: "Zichorienwurzel, Topinambur, Knoblauch, Zwiebeln." }
    ];

    let currentCategoryKey = null;

    function showHome() {
      currentCategoryKey = null;
      document.getElementById("searchInput").value = "";
      location.hash = "";
      const container = document.getElementById("contentView");
      container.innerHTML = `
        <h2 style="font-size:1.4rem; margin-bottom:6px;">Sieben Bereiche. Klare Orientierung.</h2>
        <p style="color:var(--muted); margin-bottom:14px;">Entdecke alle Nährstoffe, transparent erklärt und übersichtlich gegliedert.</p>
        <div class="groups-grid">
          ${categoriesData.map(cat => `
            <div class="group-card">
              <div class="group-illustration">${svgForCategory(cat.key,72)}</div>
              <div class="group-body">
                <h3>${cat.name}</h3>
                <p>${cat.count}</p>
                <button class="group-btn" onclick="openCategory('${cat.key}')">Kategorie öffnen</button>
              </div>
            </div>
          `).join("")}
        </div>
      `;
    }

    function openCategory(categoryKey) {
      currentCategoryKey = categoryKey;
      location.hash = "category/" + encodeURIComponent(categoryKey);
      const filtered = nutrientsData.filter(item => item.category === categoryKey);
      renderNutrientCards(filtered, true);
    }

    function toggleDetails(id) {
      const detailsEl = document.getElementById(`details-${id}`);
      const btnEl = document.getElementById(`btn-${id}`);
      const isOpen = detailsEl.classList.contains("open");

      if (isOpen) {
        detailsEl.classList.remove("open");
        btnEl.innerHTML = "▼ Details & Quellen anzeigen";
        if (currentCategoryKey) {
          location.hash = "category/" + encodeURIComponent(currentCategoryKey);
        } else {
          location.hash = "";
        }
      } else {
        detailsEl.classList.add("open");
        btnEl.innerHTML = "▲ Details ausblenden";
        location.hash = "item/" + encodeURIComponent(id);
      }
    }

    function illustrationForItem(category) {
      // use the same category SVG but slightly smaller and with a subtle background color per category
      switch (category) {
        case 'Makronährstoffe': return svgForCategory('Makronährstoffe',64);
        case 'Vitamine': return svgForCategory('Vitamine',64);
        case 'Mineralstoffe': return svgForCategory('Mineralstoffe',64);
        case 'Fettsäuren': return svgForCategory('Fettsäuren',64);
        case 'Pflanzenstoffe': return svgForCategory('Pflanzenstoffe',64);
        case 'Performance': return svgForCategory('Performance',64);
        case 'Darmgesundheit': return svgForCategory('Darmgesundheit',64);
        default: return svgForCategory('',64);
      }
    }

    function renderNutrientCards(items, showBackBtn = false) {
      const container = document.getElementById("contentView");
      if (items.length === 0) {
        container.innerHTML = `
          ${showBackBtn ? '<button style="margin-bottom:12px;" class="back-btn" onclick="showHome()">← Zurück zur Übersicht</button>' : ''}
          <p style="text-align:center; padding:20px; color:var(--muted);">Keine Nährstoffe gefunden.</p>
        `;
        return;
      }

      container.innerHTML = `
        ${showBackBtn ? '<button style="margin-bottom:12px;" class="back-btn" onclick="showHome()">← Zurück zur Übersicht</button>' : ''}
        <div style="display:grid; gap:14px;">
        ${items.map(item => `
          <div class="nutrient-card" id="${item.id}">
            <div class="nutrient-illustration">${illustrationForItem(item.category)}</div>
            <div class="nutrient-content">
              <div style="display:flex;align-items:center;gap:10px;">
                <h3>${item.name}</h3>
                <div class="category-tag">${item.category}</div>
              </div>

              <p class="short-desc">${item.funktion}</p>

              <button class="toggle-details-btn" id="btn-${item.id}" onclick="toggleDetails('${item.id}')">▼ Details & Quellen anzeigen</button>

              <div class="details-content" id="details-${item.id}">
                <div class="nutrient-section">
                  <h4>Mögliche Symptome bei Mangel</h4>
                  <p>${item.mangel}</p>
                </div>

                <div class="nutrient-section">
                  <h4>Empfohlene Tagesdosis</h4>
                  <p><strong>${item.tagesbedarf}</strong></p>
                </div>

                <div class="food-box">
                  <h4>🥦 Natürliche Lebensmittel-Quellen:</h4>
                  <p>${item.quellen}</p>
                </div>

                <div style="margin-top:10px; display:flex; gap:10px; align-items:center; justify-content:space-between;">
                  <div style="color:var(--muted); font-size:0.9rem;">🛒 Empfohlenes Produkt (*Werbung)</div>
                  <a href="#" rel="sponsored noopener" style="background:linear-gradient(180deg,#1e4f37,#165a3f); color:white; padding:8px 12px; border-radius:8px; text-decoration:none; font-weight:700;">Zum Shop</a>
                </div>
              </div>
            </div>
          </div>
        `).join("")}
        </div>
      `;
    }

    function handleSearch() {
      const searchTerm = document.getElementById("searchInput").value.trim();
      const normalized = searchTerm.toLowerCase();

      if (!normalized) { showHome(); return; }

      location.hash = "search/" + encodeURIComponent(searchTerm);
      const filtered = nutrientsData.filter(item => item.name.toLowerCase().includes(normalized) || item.funktion.toLowerCase().includes(normalized) || item.category.toLowerCase().includes(normalized));
      renderNutrientCards(filtered, true);
    }

    function handleHash() {
      const raw = location.hash.slice(1);
      if (!raw) { showHome(); return; }

      const [kind, encoded] = raw.split("/");
      const value = encoded ? decodeURIComponent(encoded) : "";

      if (kind === "category" && value) {
        currentCategoryKey = value;
        const filtered = nutrientsData.filter(item => item.category === value);
        renderNutrientCards(filtered, true); return;
      }

      if (kind === "item" && value) {
        const item = nutrientsData.find(entry => entry.id === value);
        if (item) { currentCategoryKey = item.category; renderNutrientCards([item], true); setTimeout(() => { const btn = document.getElementById(`btn-${item.id}`); const details = document.getElementById(`details-${item.id}`); if (btn && details && !details.classList.contains('open')) btn.click(); }, 30); return; }
      }

      if (kind === "search" && value) {
        const query = decodeURIComponent(value);
        document.getElementById("searchInput").value = query;
        const filtered = nutrientsData.filter(item => item.name.toLowerCase().includes(query.toLowerCase()) || item.funktion.toLowerCase().includes(query.toLowerCase()) || item.category.toLowerCase().includes(query.toLowerCase()));
        renderNutrientCards(filtered, true); return;
      }

      showHome();
    }

    window.addEventListener('hashchange', handleHash);
    handleHash();
  </script>
</body>
</html>
