    function showHome() {
      document.getElementById("searchInput").value = "";
      const container = document.getElementById("contentView");
      container.innerHTML = `
        <h2 class="hero-title">Sieben Bereiche. Klare Orientierung.</h2>
        <p class="hero-sub">Entdecke alle Nährstoffe, transparent erklärt und übersichtlich gegliedert.</p>
        <div class="groups-grid">
          ${categoriesData.map(cat => `
            <div class="group-card">
              <h3>${cat.name}</h3>
              <p>${cat.count}</p>
              <button class="group-btn" onclick="openCategory('${cat.key}')">Kategorie öffnen</button>
            </div>
          `).join("")}
        </div>
      `;
    }

    function openCategory(categoryKey) {
      const filtered = nutrientsData.filter(item => item.category === categoryKey);
      renderNutrientCards(filtered, true);
    }

    function toggleDetails(id) {
      const detailsEl = document.getElementById(`details-${id}`);
      const btnEl = document.getElementById(`btn-${id}`);
      if (detailsEl.classList.contains("open")) {
        detailsEl.classList.remove("open");
        btnEl.innerHTML = "▼ Details & Quellen anzeigen";
      } else {
        detailsEl.classList.add("open");
        btnEl.innerHTML = "▲ Details ausblenden";
      }
    }

    function renderNutrientCards(items, showBackBtn = false) {
      const container = document.getElementById("contentView");
      if (items.length === 0) {
        container.innerHTML = `
          ${showBackBtn ? '<button class="back-btn" onclick="showHome()">← Zurück zur Übersicht</button>' : ''}
          <p style="text-align:center; padding:20px; color:var(--text-muted);">Keine Nährstoffe gefunden.</p>
        `;
        return;
      }

      container.innerHTML = `
        ${showBackBtn ? '<button class="back-btn" onclick="showHome()">← Zurück zur Übersicht</button>' : ''}
        ${items.map(item => `
          <article class="nutrient-card" id="${item.id}">
            <div class="nutrient-card-header">
              <h3>${item.name}</h3>
              <span class="category-tag">${item.category}</span>
            </div>
            
            <p class="short-desc">${item.funktion}</p>

            <button class="toggle-details-btn" id="btn-${item.id}" onclick="toggleDetails('${item.id}')">
              ▼ Details & Quellen anzeigen
            </button>

            <!-- AUSKLAPPBARER BEREICH -->
            <div class="details-content" id="details-${item.id}">
              <div class="nutrient-section">
                <h4>Mögliche Symptome bei Mangel</h4>
                <p>${item.mangel}</p>
              </div>

              <div class="nutrient-section">
                <h4>Empfohlene Tagesdosis</h4>
                <p><strong>${item.tagesbedarf}</strong></p>
              </div>

              <!-- LEBENSMITTEL QUELLEN -->
              <div class="food-box">
                <h4>🥦 Natürliche Lebensmittel-Quellen:</h4>
                <p>${item.quellen}</p>
              </div>

              <!-- AFFILIATE SHOP BOX -->
              <div class="shop-box">
                <div class="shop-box-text">
                  <h4>🛒 Empfohlenes Produkt (*Werbung)</h4>
                  <p>Laborgeprüfte Qualität & hohe Bioverfügbarkeit</p>
                </div>
                <a href="#" rel="sponsored noopener" class="shop-btn">Zum Shop</a>
              </div>
            </div>
          </article>
        `).join("")}
      `;
    }

    function handleSearch() {
      const searchTerm = document.getElementById("searchInput").value.toLowerCase();
      if (!searchTerm) {
        showHome();
        return;
      }
      const filtered = nutrientsData.filter(item => 
        item.name.toLowerCase().includes(searchTerm) || 
        item.funktion.toLowerCase().includes(searchTerm) ||
        item.category.toLowerCase().includes(searchTerm)
      );
      renderNutrientCards(filtered, true);
    }

    // Startansicht
    showHome();
  </script>
