<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nährstoffkompass – Premium-Nährstoff-Guide</title>
  <style>
    :root {
      --bg: #f5f1e8;
      --bg-2: #edf6ef;
      --panel: rgba(255,255,255,0.78);
      --panel-strong: #ffffff;
      --card: #ffffff;
      --text: #173629;
      --muted: #56695d;
      --line: #e7e2d8;
      --green: #1b5e3f;
      --green-2: #266f49;
      --green-3: #ebf7ef;
      --gold: #d49a43;
      --gold-soft: #fdf2dd;
      --shadow: 0 18px 40px rgba(18, 42, 31, 0.08);
      --radius: 22px;
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      font-family: Inter, "Segoe UI", sans-serif;
      background:
        radial-gradient(circle at top left, rgba(32,101,70,0.08), transparent 28%),
        linear-gradient(180deg, #f9f7f2 0%, var(--bg) 100%);
      color: var(--text);
      line-height: 1.6;
    }

    a { color: inherit; }
    button, input { font: inherit; }

    .page-shell {
      max-width: 1180px;
      margin: 0 auto;
      padding: 0 18px 88px;
    }

    .topbar {
      background: linear-gradient(135deg, #123c2d 0%, #1e5640 55%, #2d6b4d 100%);
      color: white;
      box-shadow: 0 12px 28px rgba(10, 31, 24, 0.14);
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .topbar-inner {
      max-width: 1180px;
      margin: 0 auto;
      padding: 18px 18px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      flex-wrap: wrap;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-mark {
      width: 42px;
      height: 42px;
      border-radius: 14px;
      background: rgba(255,255,255,0.14);
      display: grid;
      place-items: center;
      border: 1px solid rgba(255,255,255,0.16);
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.12);
    }

    .brand-text {
      line-height: 1.1;
    }

    .brand-text strong {
      display: block;
      font-size: 1.1rem;
      letter-spacing: 0.02em;
    }

    .brand-text span {
      font-size: 0.72rem;
      opacity: 0.8;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .navs {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .nav-btn {
      border: 1px solid rgba(255,255,255,0.16);
      background: rgba(255,255,255,0.08);
      color: white;
      border-radius: 999px;
      padding: 9px 16px;
      cursor: pointer;
      font-weight: 600;
      transition: 0.2s ease;
    }

    .nav-btn:hover {
      background: rgba(255,255,255,0.15);
      transform: translateY(-1px);
    }

    .hero {
      margin-top: 28px;
      background: linear-gradient(135deg, rgba(255,255,255,0.80), rgba(248,251,247,0.86));
      border: 1px solid rgba(17, 46, 35, 0.06);
      border-radius: calc(var(--radius) + 12px);
      box-shadow: var(--shadow);
      overflow: hidden;
      position: relative;
    }

    .hero-inner {
      padding: 40px 30px 24px;
      display: grid;
      grid-template-columns: 1.2fr 0.8fr;
      gap: 30px;
      align-items: center;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 7px 12px;
      border-radius: 999px;
      background: var(--green-3);
      color: var(--green);
      font-size: 0.74rem;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      border: 1px solid rgba(27,94,63,0.08);
    }

    h1 {
      font-size: clamp(2rem, 3vw, 3.4rem);
      line-height: 1.08;
      margin: 18px 0 12px;
      letter-spacing: -0.05em;
    }

    .hero-copy p {
      margin: 0;
      max-width: 680px;
      color: var(--muted);
      font-size: 1.06rem;
    }

    .cta-row {
      display: flex;
      gap: 12px;
      margin-top: 24px;
      flex-wrap: wrap;
    }

    .primary-btn, .secondary-btn {
      border-radius: 14px;
      padding: 13px 20px;
      cursor: pointer;
      font-weight: 700;
      transition: transform 0.18s ease, box-shadow 0.18s ease;
      border: none;
    }

    .primary-btn {
      background: linear-gradient(135deg, var(--green) 0%, var(--green-2) 100%);
      color: #fff;
      box-shadow: 0 12px 24px rgba(28, 86, 61, 0.2);
    }

    .secondary-btn {
      background: rgba(209, 250, 221, 0.55);
      color: var(--green);
      border: 1px solid rgba(27,94,63,0.08);
    }

    .primary-btn:hover, .secondary-btn:hover {
      transform: translateY(-1px);
    }

    .stat-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(120px, 1fr));
      gap: 14px;
      margin-top: 30px;
    }

    .stat {
      background: rgba(255,255,255,0.6);
      border: 1px solid rgba(17, 46, 35, 0.06);
      border-radius: 18px;
      padding: 16px 12px;
      text-align: center;
    }

    .stat strong {
      font-size: 1.2rem;
      display: block;
      margin-bottom: 2px;
    }

    .stat span {
      color: var(--muted);
      font-size: 0.78rem;
    }

    .hero-art {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 300px;
    }

    .art-card {
      width: min(100%, 400px);
      min-height: 280px;
      border-radius: 28px;
      background:
        linear-gradient(180deg, rgba(230,248,235,0.9), rgba(245,250,246,0.9)),
        linear-gradient(135deg, rgba(255,255,255,0.85), rgba(255,255,255,0.55));
      border: 1px solid rgba(17,46,35,0.06);
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.8);
      display: grid;
      place-items: center;
      position: relative;
      overflow: hidden;
    }

    .art-card::before {
      content: "";
      position: absolute;
      inset: 14px;
      border-radius: 24px;
      border: 1px solid rgba(32, 94, 63, 0.08);
    }

    .hero-icon {
      width: 180px;
      height: 180px;
      filter: drop-shadow(0 16px 25px rgba(32, 94, 63, 0.12));
    }

    .search-area {
      margin-top: 24px;
      background: rgba(255,255,255,0.4);
      border: 1px solid rgba(17,46,35,0.06);
      border-radius: 22px;
      padding: 18px 18px 12px;
      box-shadow: var(--shadow);
    }

    .search-box {
      position: relative;
    }

    .search-box svg {
      position: absolute;
      left: 18px;
      top: 50%;
      transform: translateY(-50%);
      opacity: 0.7;
    }

    .search-box input {
      width: 100%;
      border-radius: 16px;
      border: 1px solid rgba(17,46,35,0.08);
      background: rgba(255,255,255,0.7);
      padding: 17px 18px 17px 46px;
      outline: none;
      font-size: 1rem;
      color: var(--text);
      box-shadow: inset 0 1px 2px rgba(26, 49, 37, 0.04);
    }

    .content-wrap {
      margin-top: 26px;
    }

    .section-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin: 10px 0 18px;
      flex-wrap: wrap;
    }

    .section-header h2 {
      margin: 0;
      font-size: clamp(1.5rem, 2vw, 2.1rem);
      letter-spacing: -0.04em;
    }

    .pill {
      background: var(--gold-soft);
      border: 1px solid rgba(212, 154, 67, 0.14);
      color: #8d651b;
      border-radius: 999px;
      padding: 7px 10px;
      font-weight: 700;
      font-size: 0.72rem;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }

    .grid-categories {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 20px;
    }

    .category-card {
      background: linear-gradient(180deg, rgba(255,255,255,0.92), rgba(255,255,255,0.78));
      border: 1px solid rgba(17,46,35,0.06);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 18px;
      display: flex;
      align-items: flex-start;
      gap: 16px;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .category-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 22px 42px rgba(19, 45, 34, 0.09);
    }

    .category-icon {
      width: 70px;
      height: 70px;
      border-radius: 18px;
      flex-shrink: 0;
      display: grid;
      place-items: center;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.9);
      border: 1px solid rgba(17,46,35,0.05);
    }

    .category-card h3 {
      font-size: 1.06rem;
      margin: 0 0 6px;
      letter-spacing: -0.02em;
    }

    .category-card p {
      margin: 0 0 12px;
      color: var(--muted);
      font-size: 0.88rem;
    }

    .soft-btn {
      border: none;
      background: linear-gradient(135deg, var(--green) 0%, var(--green-2) 100%);
      color: white;
      border-radius: 12px;
      padding: 10px 14px;
      cursor: pointer;
      font-weight: 700;
      transition: transform 0.18s ease;
    }

    .soft-btn:hover {
      transform: translateY(-1px);
    }

    .nutrient-list {
      display: grid;
      gap: 18px;
    }

    .nutrient-card {
      display: flex;
      align-items: flex-start;
      gap: 18px;
      background: linear-gradient(180deg, #ffffff 0%, #fbfcfa 100%);
      border: 1px solid rgba(17,46,35,0.06);
      border-radius: 22px;
      box-shadow: var(--shadow);
      padding: 18px;
    }

    .nutrient-icon {
      width: 72px;
      height: 72px;
      border-radius: 18px;
      display: grid;
      place-items: center;
      flex-shrink: 0;
      border: 1px solid rgba(17,46,35,0.05);
    }

    .nutrient-main {
      flex: 1;
      min-width: 0;
    }

    .nutrient-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 8px;
    }

    .nutrient-head h3 {
      margin: 0;
      font-size: clamp(1.1rem, 2vw, 1.4rem);
      letter-spacing: -0.03em;
    }

    .tag {
      border-radius: 999px;
      padding: 6px 10px;
      background: var(--green-3);
      border: 1px solid rgba(27,94,63,0.08);
      color: var(--green);
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }

    .nutrient-main > p {
      margin: 0 0 14px;
      color: var(--muted);
      font-size: 0.97rem;
    }

    .details-btn {
      border: none;
      background: transparent;
      color: var(--green);
      padding: 0;
      font-weight: 700;
      cursor: pointer;
      margin-bottom: 10px;
    }

    .details-box {
      display: none;
      margin-top: 14px;
      border-top: 1px dashed rgba(17,46,35,0.12);
      padding-top: 14px;
    }

    .details-box.open {
      display: block;
    }

    .info-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 12px;
    }

    .info-box {
      background: rgba(17,46,35,0.03);
      border: 1px solid rgba(17,46,35,0.04);
      border-radius: 16px;
      padding: 12px 14px;
    }

    .info-box h4 {
      margin: 0 0 6px;
      color: var(--muted);
      font-size: 0.7rem;
      letter-spacing: 0.09em;
      text-transform: uppercase;
    }

    .info-box p {
      margin: 0;
      color: var(--text);
      font-size: 0.95rem;
    }

    .food-list {
      margin-top: 14px;
      background: linear-gradient(180deg, rgba(236,249,239,0.7), rgba(244,250,245,0.8));
      border: 1px solid rgba(27,94,63,0.08);
      border-radius: 16px;
      padding: 14px;
    }

    .food-list h4 {
      margin: 0 0 6px;
      color: var(--green);
      font-size: 0.82rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .food-list p {
      margin: 0;
      color: var(--text);
      font-size: 0.94rem;
    }

    .affiliate-box {
      margin-top: 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      border: 1px solid rgba(17,46,35,0.06);
      border-radius: 16px;
      padding: 12px 14px;
      background: rgba(255,255,255,0.76);
    }

    .affiliate-box span {
      color: var(--muted);
      font-size: 0.9rem;
    }

    .shop-btn {
      background: linear-gradient(135deg, var(--green) 0%, var(--green-2) 100%);
      color: white;
      border: none;
      border-radius: 12px;
      padding: 10px 14px;
      font-weight: 700;
      cursor: pointer;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .back-btn {
      background: rgba(17,46,35,0.03);
      border: 1px solid rgba(17,46,35,0.08);
      border-radius: 12px;
      padding: 10px 14px;
      cursor: pointer;
      margin-bottom: 16px;
      font-weight: 700;
      color: var(--text);
    }

    .empty-state {
      background: rgba(255,255,255,0.72);
      border: 1px solid rgba(17,46,35,0.06);
      border-radius: 20px;
      padding: 28px;
      text-align: center;
      color: var(--muted);
      box-shadow: var(--shadow);
    }

    @media (max-width: 820px) {
      .hero-inner {
        grid-template-columns: 1fr;
        padding: 28px 20px 18px;
      }

      .hero-art { min-height: 200px; }
      .art-card { min-height: 200px; }
      .hero-icon { width: 150px; height: 150px; }
    }

    @media (max-width: 560px) {
      .topbar-inner {
        justify-content: center;
      }

      .navs {
        justify-content: center;
      }

      .stat-grid {
        grid-template-columns: 1fr;
      }

      .nutrient-card {
        flex-direction: column;
      }

      .nutrient-icon {
        width: 60px;
        height: 60px;
      }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand">
        <div class="brand-mark">
          <svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M12 2c4.7 2.3 7 5 7 8.8 0 5.2-4.4 9.2-7 11.2-2.6-2-7-6-7-11.2C5 7 7.3 4.3 12 2z" fill="#dff9e7"/>
            <path d="M12 7c1.6 1.1 2.8 2.7 2.8 4.5 0 2.5-2.2 4.8-2.8 5.5-.6-.7-2.8-3-2.8-5.5C9.2 9.7 10.4 8.1 12 7z" fill="#1e5f3b"/>

      </nav>

  </header>

  <div class="page-shell">
    <section class="hero" aria-label="Einführung">
      <div class="hero-inner">
        <div class="hero-copy">
          <div class="eyebrow">Premium-Nährstoff-Guide</div>

          <div class="stat-grid">

              <span>Bereiche</span>
            </div>
            <div class="stat">
              <strong>50+</strong>
              <span>Stoffe</span>
            </div>
            <div class="stat">
              <strong>1</strong>
              <span>klarer Kompass</span>
            </div>
          </div>
        </div>

        <div class="hero-art" aria-hidden="true">
          <div class="art-card">
            <svg class="hero-icon" viewBox="0 0 220 220" xmlns="http://www.w3.org/2000/svg">
              <defs>
                <linearGradient id="heroLeaf" x1="0%" x2="100%" y1="0%" y2="100%">
                  <stop offset="0%" stop-color="#dff9e7"/>
                  <stop offset="100%" stop-color="#8cc5a4"/>
                </linearGradient>
              </defs>
              <circle cx="110" cy="110" r="88" fill="#edf9f0"/>
              <path d="M111 42c42 17 68 47 69 90-29 16-66 19-104 6C51 117 52 75 111 42z" fill="url(#heroLeaf)"/>

              <path d="M110 40c25 28 38 56 38 87" stroke="#1d5d3d" stroke-width="6" stroke-linecap="round"/>
              <circle cx="110" cy="110" r="12" fill="#fff9ef" stroke="#d49a43" stroke-width="4"/>
            </svg>
          </div>
        </div>
      </div>
    </section>

    <section class="search-area" aria-label="Suche nach Nährstoffen">
      <div class="search-box">
        <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="11" cy="11" r="6.2" stroke="#294d3d" stroke-width="1.6" fill="none"/>
          <path d="M16 16L21 21" stroke="#294d3d" stroke-width="1.8" stroke-linecap="round"/>
        </svg>
        <input id="searchInput" type="text" placeholder="Suche nach Vitamin D, Magnesium, Kreatin, Protein..." oninput="handleSearch()"/>
      </div>

    <main id="contentView" class="content-wrap" aria-live="polite"></main>
  </div>

  <script>
    const categoriesData = [
      { name: "Makronährstoffe & Aminosäuren", count: "11 Stoffe", key: "Makronährstoffe" },

    const nutrientsData = [

      { id: "leucin", name: "L-Leucin (BCAA)", category: "Makronährstoffe", funktion: "Stimuliert die Muskelproteinsynthese und unterstützt die Muskelreparatur.", mangel: "Muskelabbau, verlangsamte Regeneration.", tagesbedarf: "Ca. 39 mg/kg Körpergewicht (WHO).", quellen: "Molkenprotein, Rindfleisch, Hähnchen, Linsen, Eier." },
      { id: "isoleucin", name: "L-Isoleucin (BCAA)", category: "Makronährstoffe", funktion: "Reguliert die Energieversorgung des Muskelgewebes und Blutzucker.", mangel: "Muskelverlust, Erschöpfung, Blutzuckerschwankungen.", tagesbedarf: "Ca. 20 mg/kg Körpergewicht (WHO).", quellen: "Fisch, Geflügel, Nüsse, Linsen, Käse." },

      const colors = {
        "Makronährstoffe": { bg: "#fff3e9", accent: "#d77d32" },
        "Vitamine": { bg: "#fff7d9", accent: "#d9a72b" },
        "Mineralstoffe": { bg: "#ebf4ff", accent: "#4093c9" },
        "Fettsäuren": { bg: "#fff1f5", accent: "#db6a88" },
        "Pflanzenstoffe": { bg: "#edfaf0", accent: "#57a870" },
        "Performance": { bg: "#fff8e8", accent: "#d38d33" },
        "Darmgesundheit": { bg: "#fff6ee", accent: "#d9915b" }
      };
      const c = colors[key] || { bg: "#edf3ef", accent: "#376c52" };

      const svgMap = {
        "Makronährstoffe": '<svg width="34" height="34" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12h16M7 7v10M17 7v10" stroke="'+c.accent+'" stroke-width="2" stroke-linecap="round"/></svg>',
        "Vitamine": '<svg width="34" height="34" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4" fill="'+c.accent+'"/><path d="M12 12v7" stroke="'+c.accent+'" stroke-width="2" stroke-linecap="round"/></svg>',
        "Mineralstoffe": '<svg width="34" height="34" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l7 4v6c0 4.5-7 8-7 8s-7-3.5-7-8V7l7-4z" fill="'+c.accent+'" opacity="0.75"/><path d="M12 7v7" stroke="#fff" stroke-width="2" stroke-linecap="round"/></svg>',
        "Fettsäuren": '<svg width="34" height="34" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2c-3.6 4.2-6 6.7-6 10.1C6 17.4 8.7 20 12 20s6-2.6 6-7.9C18 8.7 15.6 6.2 12 2z" fill="'+c.accent+'" opacity="0.85"/></svg>',
        "Pflanzenstoffe": '<svg width="34" height="34" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3c3.5 2.6 6 5.1 6 8.7 0 4.5-4 8.3-6 10.3-2-2-6-5.8-6-10.3C6 8.1 8.5 5.6 12 3z" fill="'+c.accent+'" opacity="0.8"/></svg>',
        "Performance": '<svg width="34" height="34" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12h6l3-8 3 16 2-8h4" stroke="'+c.accent+'" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg>',
        "Darmgesundheit": '<svg width="34" height="34" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="7.5" fill="'+c.accent+'" opacity="0.8"/><path d="M12 5c2.3 1.5 4 3.5 4 6 0 2.5-2.1 5-4 6-1.9-1-4-3.5-4-6 0-2.5 1.7-4.5 4-6z" fill="#fff" opacity="0.85"/></svg>'
      };

      return `<div class="category-icon" style="background:${c.bg};">${svgMap[key] || svgMap["Makronährstoffe"]}</div>`;
    }

    function nutrientIcon(category) {
      return categoryIcon(category);

    function showHome() {
      document.getElementById('searchInput').value = '';
      location.hash = '';
      const container = document.getElementById('contentView');
      container.innerHTML = `
        <div class="section-header">
          <h2>Wähle einen Bereich</h2>
          <span class="pill">Premium Übersicht</span>
        </div>
        <div class="grid-categories">
          ${categoriesData.map(cat => `
            <article class="category-card">
              ${categoryIcon(cat.key)}
              <div style="flex:1; min-width:0;">
                <h3>${cat.name}</h3>
                <p>${cat.count}</p>
                <button class="soft-btn" type="button" onclick="openCategory('${cat.key}')">Kategorie öffnen</button>
              </div>
            </article>
          `).join('')}
        </div>
      `;
    }

    function openCategory(categoryKey) {
      currentCategoryKey = categoryKey;
      location.hash = 'category/' + encodeURIComponent(categoryKey);
      const filtered = nutrientsData.filter(item => item.category === categoryKey);
      renderNutrientCards(filtered, true);
    }

    function toggleDetails(id) {
      const box = document.getElementById(`details-${id}`);
      const btn = document.getElementById(`btn-${id}`);
      const isOpen = box.classList.contains('open');

      if (isOpen) {
        box.classList.remove('open');
        btn.textContent = '▼ Details & Quellen anzeigen';
        if (currentCategoryKey) {
          location.hash = 'category/' + encodeURIComponent(currentCategoryKey);
        } else {
          location.hash = '';
        }
      } else {
        box.classList.add('open');
        btn.textContent = '▲ Details ausblenden';
        location.hash = 'item/' + encodeURIComponent(id);
      }
    }

    function renderNutrientCards(items, showBackBtn = false) {
      const container = document.getElementById('contentView');
      if (!items.length) {
        container.innerHTML = `
          ${showBackBtn ? '<button class="back-btn" type="button" onclick="showHome()">← Zurück zur Übersicht</button>' : ''}
          <div class="empty-state">Keine Nährstoffe gefunden.</div>
        `;
        return;
      }

      container.innerHTML = `
        ${showBackBtn ? '<button class="back-btn" type="button" onclick="showHome()">← Zurück zur Übersicht</button>' : ''}
        <div class="nutrient-list">
          ${items.map(item => `
            <article class="nutrient-card" id="${item.id}">
              <div class="nutrient-icon">${nutrientIcon(item.category)}</div>
              <div class="nutrient-main">
                <div class="nutrient-head">
                  <h3>${item.name}</h3>
                  <span class="tag">${item.category}</span>
                </div>
                <p>${item.funktion}</p>

                <button class="details-btn" id="btn-${item.id}" type="button" onclick="toggleDetails('${item.id}')">
                  ▼ Details & Quellen anzeigen
                </button>

                <div class="details-box" id="details-${item.id}">
                  <div class="info-grid">
                    <div class="info-box">
                      <h4>Mangel</h4>
                      <p>${item.mangel}</p>
                    </div>
                    <div class="info-box">
                      <h4>Tagesbedarf</h4>
                      <p>${item.tagesbedarf}</p>
                    </div>
                  </div>

                  <div class="food-list">
                    <h4>Natürliche Quellen</h4>
                    <p>${item.quellen}</p>
                  </div>

                  <div class="affiliate-box">
                    <span>🛒 Empfohlenes Produkt (*Werbung)</span>
                    <a class="shop-btn" href="#" rel="sponsored noopener">Zum Shop</a>
                  </div>
                </div>
              </div>
            </article>
          `).join('')}
        </div>
      `;
    }

    function handleSearch() {
      const term = document.getElementById('searchInput').value.trim();
      const value = term.toLowerCase();

      if (!value) {
        showHome();
        return;
      }

      location.hash = 'search/' + encodeURIComponent(term);
      const filtered = nutrientsData.filter(item =>
        item.name.toLowerCase().includes(value) ||
        item.funktion.toLowerCase().includes(value) ||
        item.category.toLowerCase().includes(value)
      );
      renderNutrientCards(filtered, true);
    }

    let currentCategoryKey = null;

    function handleHash() {
      const raw = location.hash.slice(1);
      if (!raw) {
        showHome();
        return;
      }

      const [kind, encoded] = raw.split('/');
      const value = encoded ? decodeURIComponent(encoded) : '';

      if (kind === 'category' && value) {
        currentCategoryKey = value;
        const filtered = nutrientsData.filter(item => item.category === value);
        renderNutrientCards(filtered, true);
        return;
      }

      if (kind === 'item' && value) {
        const item = nutrientsData.find(entry => entry.id === value);
        if (item) {
          currentCategoryKey = item.category;
          renderNutrientCards([item], true);
          setTimeout(() => {
            const btn = document.getElementById(`btn-${item.id}`);
            const box = document.getElementById(`details-${item.id}`);
            if (btn && box && !box.classList.contains('open')) {
              btn.click();
            }
          }, 30);
          return;
        }
      }

      if (kind === 'search' && value) {
        document.getElementById('searchInput').value = value;
        const filtered = nutrientsData.filter(item =>
          item.name.toLowerCase().includes(value.toLowerCase()) ||
          item.funktion.toLowerCase().includes(value.toLowerCase()) ||
          item.category.toLowerCase().includes(value.toLowerCase())
        );
        renderNutrientCards(filtered, true);
        return;
      }

      showHome();
    }

    window.addEventListener('hashchange', handleHash);
    handleHash();
  </script>
</body>
</html>
